# CAEMS v2 — Symbol-class presets
# Every key overrides the strategy defaults in settings.py.
# A symbol resolves its config as: defaults <- preset <- per-symbol override.
# Presets are versioned; every signal/trade persists (preset_id, preset_version,
# config_hash) so results remain attributable after edits.
#
# Design rules baked into these presets:
# - Frozen parameters (EMA 12/48, 20/50, ATR 14, TP 1.35R, time stop 15m)
#   are NOT preset keys. Presets tune gates/liquidity/risk, never the core
#   signal geometry — otherwise every preset is a new strategy needing its
#   own validation campaign.
# - Riskier classes get STRICTER gates and SMALLER risk, never the reverse.
# - "disabled: true" presets exist so the dashboard can show *why* a class
#   is untradable instead of silently hiding it.

presets:

  btc:
    version: 1
    description: "BTCUSDT only. Deepest book on the venue; loosest gates."
    symbols_match: ["BTCUSDT"]
    strength_min: 0.20
    strength_max: 1.50
    entry_max_atr: 0.50
    rvol_min: 1.3
    bar_range_max_atr: 3.0
    spread_max_bps: 1.0
    spread_stability_60s_bps: 1.0
    funding_blackout_s: 120
    btc_veto_enabled: false          # BTC is the reference asset
    risk_per_trade_pct: 0.15
    leverage_cap: 2
    depth_size_frac: 0.15            # max size as fraction of depth within 1 stop
    exec_floor_max_stop_frac: 0.5    # reject if execution_floor > 0.5 * atr_stop
    min_listing_age_days: 0
    max_positions_in_class: 1

  eth:
    version: 1
    description: "ETHUSDT. Near-BTC liquidity but BTC-veto applies."
    symbols_match: ["ETHUSDT"]
    strength_min: 0.20
    strength_max: 1.50
    entry_max_atr: 0.50
    rvol_min: 1.3
    bar_range_max_atr: 3.0
    spread_max_bps: 1.2
    spread_stability_60s_bps: 1.2
    funding_blackout_s: 120
    btc_veto_enabled: true
    btc_veto_threshold: 0.30
    risk_per_trade_pct: 0.15
    leverage_cap: 2
    depth_size_frac: 0.15
    exec_floor_max_stop_frac: 0.5
    min_listing_age_days: 0
    max_positions_in_class: 1

  major_alt:
    version: 1
    description: "Top-liquidity alts (SOL, XRP, BNB, DOGE tier by volume rank <= 15)."
    universe_rule: { quote_volume_rank_max: 15, exclude_presets: [btc, eth] }
    strength_min: 0.22
    strength_max: 1.40
    entry_max_atr: 0.45
    rvol_min: 1.4
    bar_range_max_atr: 2.8
    spread_max_bps: 1.8
    spread_stability_60s_bps: 1.8
    funding_blackout_s: 180
    btc_veto_enabled: true
    btc_veto_threshold: 0.25         # stricter: mild BTC weakness already vetoes
    require_btc_strength_min: 0.0    # soft veto: alt longs need BTC >= 0
    risk_per_trade_pct: 0.12
    leverage_cap: 2
    depth_size_frac: 0.12
    exec_floor_max_stop_frac: 0.5
    min_listing_age_days: 30
    max_positions_in_class: 2

  mid_alt:
    version: 1
    description: "Mid-cap alts, volume rank 16-60. Liquidity gates start binding."
    universe_rule: { quote_volume_rank_min: 16, quote_volume_rank_max: 60 }
    strength_min: 0.25
    strength_max: 1.30
    entry_max_atr: 0.40
    rvol_min: 1.5
    bar_range_max_atr: 2.5
    spread_max_bps: 2.5
    spread_stability_60s_bps: 2.0
    funding_blackout_s: 240
    btc_veto_enabled: true
    btc_veto_threshold: 0.20
    require_btc_strength_min: 0.0
    risk_per_trade_pct: 0.10
    leverage_cap: 2
    depth_size_frac: 0.10
    exec_floor_max_stop_frac: 0.45
    min_listing_age_days: 30
    max_positions_in_class: 2

  meme:
    version: 1
    description: "Meme perps (DOGE/SHIB/PEPE/WIF/BONK...). High RVOL regime is the
                  only regime worth touching; violent wicks; strong BTC beta plus
                  idiosyncratic pumps."
    universe_rule: { tag: meme }     # tag list maintained in universe config
    strength_min: 0.30
    strength_max: 1.20               # meme 'extreme strength' = climax, hard cut
    entry_max_atr: 0.35              # never chase; memes retrace to mean violently
    rvol_min: 2.0                    # only trade when crowd is actually present
    bar_range_max_atr: 2.2           # wick filter matters most here
    spread_max_bps: 3.0
    spread_stability_60s_bps: 2.5
    funding_blackout_s: 300
    btc_veto_enabled: true
    btc_veto_threshold: 0.20
    require_btc_strength_min: 0.0
    risk_per_trade_pct: 0.08
    leverage_cap: 1
    depth_size_frac: 0.08
    exec_floor_max_stop_frac: 0.40
    min_listing_age_days: 30
    max_positions_in_class: 1
    shorts_enabled: true             # meme shorts allowed but same gates apply

  hype_alt:
    version: 1
    description: "Symbols in an active hype cycle: 24h volume >= 3x its 30d median
                  (auto-detected, not a hand list). Momentum is real but crowded;
                  spread/funding blow out."
    universe_rule: { volume_surge_ratio_min: 3.0, min_quote_volume_rank: 80 }
    strength_min: 0.28
    strength_max: 1.20
    entry_max_atr: 0.35
    rvol_min: 1.8
    bar_range_max_atr: 2.2
    spread_max_bps: 2.5
    spread_stability_60s_bps: 2.0
    funding_blackout_s: 300
    funding_rate_abs_max: 0.0008     # skip entries when |predicted funding| extreme
    btc_veto_enabled: true
    btc_veto_threshold: 0.25
    risk_per_trade_pct: 0.08
    leverage_cap: 1
    depth_size_frac: 0.08
    exec_floor_max_stop_frac: 0.40
    min_listing_age_days: 14
    max_positions_in_class: 1

  new_listing:
    version: 1
    description: "Listed < 30 days. DISABLED for trading by default: no ATR/volume
                  baseline, no historical expectancy, discovery-phase volatility.
                  Scanner still tracks them so data accrues for later."
    universe_rule: { listing_age_days_max: 30 }
    disabled: true
    disabled_reason: "INSUFFICIENT_HISTORY"
    observe_only: true               # SymbolState + rejections persisted anyway

  low_liquidity:
    version: 1
    description: "Volume rank > 60 or fails depth screen. DISABLED: execution floor
                  dominates stop geometry; CAEMS is not scalpable here."
    universe_rule: { quote_volume_rank_min: 61 }
    disabled: true
    disabled_reason: "LIQUIDITY_TOO_LOW"
    observe_only: true

  high_funding:
    version: 1
    description: "Overlay preset (applies ON TOP of the symbol's class) when
                  |predicted funding| >= 0.05%/interval or interval < 8h.
                  Not a symbol list — a market condition."
    overlay: true
    funding_blackout_s: 420
    funding_rate_abs_max: 0.0005
    shorts_bias_note: "extreme positive funding favors shorts; recorded as a
                       feature for the edge model, NOT used to flip signals"
    risk_per_trade_multiplier: 0.75

  event_risk:
    version: 1
    description: "Overlay for macro-event windows (FOMC, CPI — hand-scheduled
                  calendar in config). Blocks NEW entries in the window; existing
                  positions keep normal exit logic."
    overlay: true
    entries_disabled: true
    window_before_min: 15
    window_after_min: 15

# Resolution order when multiple match:
#   class preset (exactly one: btc > eth > meme(tag) > hype > major > mid > new > low)
#   + any active overlays (high_funding, event_risk)
# Overlay values that tighten always win; overlays can never loosen a gate.
